{% extends "base.html" %}

{% block content %}
<div class="auth-card" style="margin: 0 auto; max-width: 500px; text-align: left;">
    <h2 style="text-align: center;">Edit Profile</h2>
    
    <form method="POST">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}">
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}">
            </div>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="phone_number" class="form-control" value="{{ user.phone_number }}">
        </div>

        <div class="form-group">
            <label>Email (Cannot be changed)</label>
            <input type="email" class="form-control" value="{{ user.email }}" disabled style="background: #e9ecef;">
        </div>

        <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">Save Changes</button>
            <a href="{{ url_for('user_routes.view_profile') }}" class="btn btn-secondary" style="flex: 1; text-align: center; background: #6c757d; color: white;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
